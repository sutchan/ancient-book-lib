name: Rebuild CBDB Index

# 手动触发的 CBDB 人物索引重建 workflow
# 上游 cbdb-project/cbdb_sqlite 发布新版时，运行此 workflow 重建 public/index/cbdb/
# 产物会被提交到仓库（与 daizhige 索引一致策略）

on:
  workflow_dispatch:
    inputs:
      sqlite_url:
        description: "CBDB SQLite 压缩包 URL（默认使用 latest.json 指向的 HuggingFace 地址）"
        required: false
        default: ""

permissions:
  contents: write

# 防止并发重建互相 push 冲突（保留进行中的运行）
concurrency:
  group: rebuild-cbdb
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # fetch-depth: 0 确保完整历史，避免 git push 因非快进而被拒
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get latest release info
        id: latest
        run: |
          curl -sL "https://raw.githubusercontent.com/cbdb-project/cbdb_sqlite/master/latest.json" -o latest.json
          echo "url=$(node -e "console.log(JSON.parse(require('fs').readFileSync('latest.json','utf8')).huggingface_url)")" >> "$GITHUB_OUTPUT"

      - name: Download CBDB SQLite
        run: |
          mkdir -p tmp/cbdb
          URL="${{ github.event.inputs.sqlite_url || steps.latest.outputs.url }}"
          echo "Downloading from: $URL"
          curl -sL --retry 3 "$URL" -o tmp/cbdb/cbdb.zip
          ls -lh tmp/cbdb/cbdb.zip

      - name: Extract SQLite
        run: |
          cd tmp/cbdb
          unzip -o cbdb.zip
          ls -lh *.sqlite3

      - name: Build CBDB index
        run: |
          SQLITE=$(ls tmp/cbdb/*.sqlite3 | head -1)
          echo "Using: $SQLITE"
          node scripts/build-cbdb-index.mjs "$SQLITE"
          node scripts/build-cbdb-relations.mjs "$SQLITE"
          node scripts/build-cbdb-offices.mjs "$SQLITE"
          node scripts/build-cbdb-analysis.mjs "$SQLITE"
          node scripts/build-cbdb-altnames.mjs "$SQLITE"
          node scripts/build-cbdb-entry.mjs "$SQLITE"
          node scripts/build-cbdb-sources.mjs "$SQLITE"
          node scripts/build-cbdb-years.mjs "$SQLITE"

      - name: Verify index
        run: |
          node -e "const m=require('./public/index/cbdb/meta.json'); const r=require('./public/index/cbdb/rel/rel-meta.json'); const o=require('./public/index/cbdb/offices/offices-meta.json'); const g=require('./public/index/cbdb/geo/geo-meta.json'); const a=require('./public/index/cbdb/altnames/altnames-meta.json'); const e=require('./public/index/cbdb/entry/entry-meta.json'); const s=require('./public/index/cbdb/sources/sources-meta.json'); const y=require('./public/index/cbdb/person-years.json'); console.log('total:', m.total, '| kin:', r.stats.kinTotal, '| offices:', o.stats.officeTotal, '| geo:', g.stats.personTotal, '| altnames:', a.stats.altnameTotal, '| entry:', e.stats.entryTotal, '| sources:', s.stats.sourceTotal, '| years:', y.stats.withYear); if(m.total < 600000 || r.stats.kinTotal < 500000 || o.stats.officeTotal < 500000 || g.stats.personTotal < 300000 || a.stats.altnameTotal < 150000 || e.stats.entryTotal < 200000 || s.stats.sourceTotal < 400000 || y.stats.withYear < 250000) { console.error('数据量异常，中止'); process.exit(1); }"

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index/cbdb/
          git diff --cached --quiet || git commit -m "chore: 重建 CBDB 人物/关系/任职索引（$(node -e "console.log(require('./public/index/cbdb/meta.json').total)") 人 / $(node -e "console.log(require('./public/index/cbdb/offices/offices-meta.json').stats.officeTotal)") 任职）"
          git push
