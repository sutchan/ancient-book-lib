name: Build & Deploy

# 生产站点：https://guji.ewuse.com/（腾讯云 EdgeOne Pages，由其自行拉取仓库构建）
# Pages 部署为可选：仅当仓库变量 ENABLE_PAGES = true 时启用
# （Settings → Secrets and variables → Actions → Variables）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 权限：允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 部署任务不允许被取消，否则会出现「部署进行中被取消 / 404」
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build daizhige catalog index (15,694 books from upstream repo)
        run: npm run build:catalog

      - name: Build fulltext index + chapter manifests (4.9GB upstream TXT, 生成全文检索与 Range 分片所需产物)
        run: npm run build:fulltext

      - name: Lint & Type check (via build)
        env:
          # 配置自定义域名时 basePath 为空；默认 GitHub Pages 子路径为 /ancient-book-lib
          NEXT_PUBLIC_BASE_PATH: ${{ vars.PAGES_CUSTOM_DOMAIN == '' && '/ancient-book-lib' || '' }}
        run: npm run build

      - name: Run unit tests
        run: npm test

      # 自定义域名：仓库变量 PAGES_CUSTOM_DOMAIN
      # 未配置则不写入 CNAME，站点使用默认域名
      - name: Write CNAME (custom domain, optional)
        if: vars.PAGES_CUSTOM_DOMAIN != ''
        env:
          DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: printf '%s\n' "$DOMAIN" > out/CNAME

      - name: Upload build output (out/)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: out-${{ github.sha }}
          path: ./out
          retention-days: 7

      # 仅开启 Pages 时才上传 Pages 产物（PR 不上传）
      - name: Upload static artifact (out/)
        if: github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          # 保留 .nojekyll 等隐藏文件
          include-hidden-files: true

  # 仅 main 分支推送/手动触发且开启 Pages 时部署
  deploy:
    if: github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
