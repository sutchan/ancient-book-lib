name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 权限：允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 部署任务不允许被取消，否则会出现「部署进行中被取消 / 404」
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync data from prototype (single source of truth)
        run: npm run build:index

      - name: Lint & Type check (via build)
        run: npm run build

      - name: Run unit tests
        run: npm test

      # PR 仅做校验（构建 + 类型检查 + 测试），不上传产物
      - name: Upload static artifact (out/)
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # 仅 main 分支推送/手动触发时部署
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
