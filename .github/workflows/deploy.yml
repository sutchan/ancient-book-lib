name: Build & Deploy

# 生产站点：https://guji.ewuse.com/（腾讯云 EdgeOne Pages，由其自行拉取仓库构建）
# Pages 部署为可选：仅当仓库变量 ENABLE_PAGES = true 时启用
# （Settings → Secrets and variables → Actions → Variables）
#
# 流水线分两段：
#   - check：push / PR 均运行，仅做类型检查 + 单元测试（秒级~分钟级，快速反馈门禁）
#   - build：check 之后，仅 main 推送 / 手动触发时重建重型索引（catalog 1.5 万册 + fulltext 4.9GB）
#            并执行 next build + 部署；PR 仅做 next build 编译校验，跳过重型索引重建以节省资源

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支并发取消旧运行：PR 取消进行中的校验，main 顺序执行以保证部署不被打断
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 快速校验门禁：所有事件运行，不重建数据索引
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  # 完整构建 + 部署：main 推送 / 手动触发；PR 仅编译校验
  build:
    needs: check
    runs-on: ubuntu-latest
    # 冷启动（缓存未命中）时 fulltext 步骤本身即需数十分钟，故作业上限高于各步骤预算之和；
    # 真正的卡死由各步骤的 timeout-minutes 定位并快速失败（报错会带步骤名）。
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 重型索引重建仅在 main 推送 / 手动触发时执行（PR 跳过，使用已提交数据编译校验）
      - name: Build daizhige catalog index (15,694 books from upstream repo)
        id: catalog
        if: github.event_name != 'pull_request'
        timeout-minutes: 15
        run: |
          npm run build:catalog
          # 上游根 tree 的 SHA：git 对象内容寻址，仅上游真正变更时才改变。
          TREE_SHA="$(node -p "require('./public/index/catalog-fingerprint.json').treeSha || ''")"
          if [ -z "$TREE_SHA" ]; then
            echo "::error::未取到上游 tree SHA，拒绝使用会退化为「永久命中」的缓存键"
            exit 1
          fi
          echo "tree_sha=$TREE_SHA" >> "$GITHUB_OUTPUT"

      # 重型索引产物缓存：fulltext-index.json 与 chapters.json 完全由上游 TXT 内容决定。
      # 缓存键必须取自**确定性**指纹（catalog-fingerprint.json），不能直接哈希
      # daizhige-catalog.json——它的 generatedAt 每轮都是新时间戳，会让键每轮都变，
      # 缓存永久 miss，于是 4.9GB 重下载 + 全量分词在每次 main 推送完整重跑：
      # 这正是 build 作业撞上 60 分钟超时的根因。
      - name: Restore heavy index cache (fulltext + chapters)
        id: index-cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            public/index/fulltext-index.json
            public/index/chapters.json
          key: fulltext-${{ steps.catalog.outputs.tree_sha }}

      - name: Build fulltext index + chapter manifests (4.9GB upstream TXT)
        if: github.event_name != 'pull_request' && steps.index-cache.outputs.cache-hit != 'true'
        timeout-minutes: 60
        env:
          # 4.9GB 文本的分词/章节解析为纯 CPU 工作，放宽堆上限避免 GC 抖动拖慢构建
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build:fulltext

      - name: Build (next build -> out/)
        timeout-minutes: 25
        env:
          # 配置自定义域名时 basePath 为空；默认 GitHub Pages 子路径为 /ancient-book-lib
          NEXT_PUBLIC_BASE_PATH: ${{ vars.PAGES_CUSTOM_DOMAIN == '' && '/ancient-book-lib' || '' }}
        run: npm run build

      - name: Upload build output (out/)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: out-${{ github.sha }}
          path: ./out
          retention-days: 7

      # 自定义域名：仓库变量 PAGES_CUSTOM_DOMAIN
      # 未配置则不写入 CNAME，站点使用默认域名
      - name: Write CNAME (custom domain, optional)
        if: vars.PAGES_CUSTOM_DOMAIN != ''
        run: printf '%s\n' "${{ vars.PAGES_CUSTOM_DOMAIN }}" > out/CNAME

      # 仅开启 Pages 时才上传 Pages 产物（PR 不上传）
      - name: Upload static artifact (out/)
        if: github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          # 保留 .nojekyll 等隐藏文件
          include-hidden-files: true

  # 仅 main 分支推送/手动触发且开启 Pages 时部署
  deploy:
    if: github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
