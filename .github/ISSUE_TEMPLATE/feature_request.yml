name: ✨ 功能建议
description: 提出新功能或改进建议（需符合公益、非商用、纯静态架构定位）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目为**公益、非商用、纯静态、零数据库**开源项目。涉及广告、付费、注册登录、埋点统计、后端数据库、服务端存储的方案会被直接关闭。
        建议先阅读 [贡献指南](https://github.com/sutchan/ancient-book-lib/blob/main/.github/CONTRIBUTING.md) 中的架构边界。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述当前使用中的痛点，而不是直接描述方案
      placeholder: 阅读长篇典籍时无法快速回到上次位置，需要重新翻找
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望怎么实现？涉及哪个页面或模块？
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 首页
        - 馆藏分类 / 书单
        - 检索
        - 阅读器
        - 人物考据 / 社会关系
        - 数据统计
        - 帮助与合规页
        - 原型（prototype/）
        - 全站 / 其他
    validations:
      required: true

  - type: dropdown
    id: architecture-fit
    attributes:
      label: 是否符合架构约束
      description: 是否需要引入后端、数据库或服务端存储？
      options:
        - 符合，纯前端即可实现
        - 不确定，需要讨论
        - 需要后端或数据库（很可能被拒绝）
    validations:
      required: true

  - type: dropdown
    id: commercial
    attributes:
      label: 是否涉及商业化
      options:
        - 否，纯公益功能
        - 是（广告/付费/合作，会被拒绝）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 参考材料
      description: 类似产品、史料依据、设计稿或原型改动说明
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现该功能
